<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN // 2026_PHOTO_CORE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            background: #000; 
            color: #fff; 
            margin: 0; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- NAVIGATION FIX --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-id {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #00f2ff;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            transition: 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            opacity: 1;
            color: #00f2ff;
        }

        /* --- PAGE CONTENT --- */
        .album-header { 
            padding: 160px 8% 60px; 
        }
        .album-header h1 { font-size: clamp(3rem, 10vw, 6rem); margin: 0; letter-spacing: -2px; text-transform: uppercase; }
        .album-header p { color: #00f2ff; letter-spacing: 4px; font-size: 0.7rem; margin: 0; }

        .album-container { padding: 0 8% 150px; }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 60px;
        }

        /* --- POLAROID STYLE --- */
        .photo-print {
            position: relative;
            background: #fdfdfd;
            padding: 15px 15px 45px 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: rotate(var(--rotation));
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 0;
            cursor: pointer;
        }

        .photo-print.reveal { opacity: 1; }

        .photo-print:hover {
            transform: rotate(0deg) scale(1.05) translateY(-15px) !important;
            z-index: 100;
            box-shadow: 0 30px 60px rgba(0, 242, 255, 0.2);
        }

        .photo-print img {
            width: 100%;
            height: 300px; 
            object-fit: cover;
            display: block;
            filter: contrast(1.1);
        }

        .photo-caption {
            margin-top: 25px;
            color: #1a1a1a;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .photo-print:nth-child(odd) { --rotation: -2deg; }
        .photo-print:nth-child(even) { --rotation: 2deg; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-id">TN // PHOTO_ALBUM</div>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="photo.html" class="active">PHOTO</a></li>
            <li><a href="design.html">DESIGN</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <header class="album-header">
        <h1>THE ALBUM</h1>
        <p>DIGITAL_COLLECTION // VOL_01</p>
    </header>

    <main class="album-container">
        <div class="album-grid">
            
            <div class="photo-print">
                <img src="photo page/bluetree.jpeg">
                <div class="photo-caption">DSC_001 // BLUETREE</div>
            </div>

            <div class="photo-print">
                <img src="photo page/dog.jpeg">
                <div class="photo-caption">DSC_002 // DOG</div>
            </div>

            <div class="photo-print">
                <img src="photo page/lego.jpeg">
                <div class="photo-caption">DSC_003 // LEGO</div>
            </div>

            <div class="photo-print">
                <img src="photo page/mountain.jpeg">
                <div class="photo-caption">DSC_004 // MOUNTAIN</div>
            </div>

            <div class="photo-print">
                <img src="photo page/nhieuxe.jpeg">
                <div class="photo-caption">DSC_005 // NHIEUXE</div>
            </div>

            <div class="photo-print">
                <img src="photo page/rung.png">
                <div class="photo-caption">DSC_006 // RUNG</div>
            </div>

            <div class="photo-print">
                <img src="photo page/tuyet.jpeg">
                <div class="photo-caption">DSC_007 // TUYET</div>
            </div>

            <div class="photo-print">
                <img src="photo page/wheelchair.jpeg">
                <div class="photo-caption">DSC_008 // WHEELCHAIR</div>
            </div>

            <div class="photo-print">
                <img src="photo page/whiteflower.jpg">
                <div class="photo-caption">DSC_009 // WHITEFLOWER</div>
            </div>

            <div class="photo-print">
                <img src="photo page/xexin.jpeg">
                <div class="photo-caption">DSC_010 // XEXIN</div>
            </div>

        </div>
    </main>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.photo-print').forEach(print => {
            observer.observe(print);
        });
    </script>

</body>
</html>
