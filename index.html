<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN // 2026_SYSTEM_CORE</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* --- THE BACKGROUND LAYER --- */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Futuristic abstract background */
            background-image: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 0;
            opacity: 0.3;
            filter: grayscale(100%) brightness(0.7);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
        }

        .nav-id {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #00f2ff;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            transition: 0.3s;
            opacity: 0.6;
        }

        nav ul li a:hover, nav ul li a.active {
            opacity: 1;
            color: #00f2ff;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
            pointer-events: none;
        }

        .hero-status {
            font-family: 'Courier New', monospace;
            color: #00f2ff;
            font-size: 0.75rem;
            letter-spacing: 6px;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 1s forwards 0.5s;
        }

        .hero h1 {
            font-size: clamp(4rem, 15vw, 10rem);
            line-height: 0.85;
            margin: 0;
            letter-spacing: -6px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 1s forwards 0.8s;
        }

        .hero h1 span {
            color: transparent;
            -webkit-text-stroke: 1.5px #fff;
        }

        .explore-btn {
            pointer-events: auto;
            margin-top: 50px;
            display: inline-block;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 20px 45px;
            width: fit-content;
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            opacity: 0;
            animation: fadeIn 1.5s forwards 1.8s;
        }

        .explore-btn:hover {
            background: #00f2ff;
            color: #000;
            border-color: #00f2ff;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.5);
            transform: scale(1.05);
        }

        /* --- KEYFRAMES --- */
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div class="overlay"></div>
    <div id="particles-js"></div>

    <nav>
        <div class="nav-id">TN // DIGITAL_CORE_V3</div>
        <ul>
            <li><a href="index.html" class="active">HOME</a></li>
            <li><a href="photo.html">PHOTO</a></li>
            <li><a href="design.html">DESIGN</a></li>
             <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <main class="hero">
        <div class="hero-status">CONNECTION_SECURE // 2026</div>
        <h1>The<br><span>Photo page</span></h1>
        <a href="design.html" class="explore-btn">INITIALIZE ARCHIVE</a>
    </main>

    <script>
        /* Particle Configuration */
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#00f2ff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": true },
                "size": { "value": 2, "random": true },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#00f2ff",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.2,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out"
                }
            },
            "interactivity": {
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" }
                },
                "modes": {
                    "grab": { "distance": 200, "line_linked": { "opacity": 0.5 } }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
